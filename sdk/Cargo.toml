[package]
name = "sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
ntrix-vdc-sdk = { git = "https://github.com/NtrixOS/ntrix-vdc.git", rev = "24e503f" }
bitflags = { version = "2.13.1", default-features = false, features = [ "bytemuck" ] }
defmt = { version = "1.1", optional = true }
num_enum = { version = "0.7.6", default-features = false }
bytemuck = { version = "1.25", features = [ "derive" ] }

[features]
defmt = ["dep:defmt", "ntrix-vdc-sdk/defmt"]

[build-dependencies]
cbindgen = "0.29"
